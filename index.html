<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>رزرو آنکال | مرکز ساحل</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">ساحل</div>
      <div class="subtitle">رزرو آنکال پرسنل</div>
    </header>

    <!-- Temporary user (later from Bale) -->
    <div class="temp-user" id="tempUserBox">
      <small>موقت - بعداً از بله گرفته می‌شود</small>
      <input type="text" id="tempName" placeholder="نام شما را وارد کنید" />
    </div>

    <section class="days-section">
      <h2>۱۰ روز آینده</h2>
      <div id="daysContainer" class="days-container"></div>
    </section>

    <section class="manager-toggle">
      <button id="managerBtn" class="btn-outline">مشاهده وضعیت کلی (مدیر)</button>
    </section>

    <section class="manager-panel" id="managerPanel" style="display:none;">
      <h2>وضعیت آنکال</h2>
      <div id="managerContent"></div>
      <button id="closeManager" class="btn-secondary">بستن</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
